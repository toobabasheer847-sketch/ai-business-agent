name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

  # E2E verification scripts require a live API, PostgreSQL, Redis, and Gemini.
  # Run locally after starting services:
  #   node scripts/verify-phase5-rag-flow.js
  #   node scripts/verify-conversational-chat.js
